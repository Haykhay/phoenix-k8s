apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    {{- if .Values.acmeEmail }}
    email: {{ .Values.acmeEmail }}
    {{- end }}
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          {{- toYaml .Values.dns01.public | nindent 10 }}
        selector:
          dnsZones:
            - {{ .Values.publicZoneName | quote }}
      - dns01:
          {{- toYaml .Values.dns01.internal | nindent 10 }}
        selector:
          dnsZones:
            - {{ .Values.internalZoneName | quote }}
