# Bound to model-store's writer identity by the cloud slice (Pod Identity on
# AWS: no annotation).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.saAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
